<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crunchy Bananas - Premium Chips</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="cursor-follower"></div>
    
    <nav>
        <div class="logo">CRUNCHY</div>
        <div class="links">
            <a href="#flavors">Flavors</a>
            <a href="#about">Our Story</a>
            <button class="cta-btn">Shop Now</button>
        </div>
    </nav>

    <header id="hero">
        <div class="hero-content">
            <h1>SNACK <br> <span class="highlight">VIBRANTLY</span></h1>
            <p>Experience the crunch of 6 exotic flavors.</p>
            <button class="main-cta">Taste the Crunch</button>
        </div>
        <div class="hero-visual">
            <img src="assets/hero_chips.png" alt="Floating Banana Chips" id="hero-img">
        </div>
    </header>

    <section id="flavors">
        <h2>Our <span class="highlight">Flavors</span></h2>
        <div class="flavor-grid">
            <!-- Flavors will be injected here by JS -->
        </div>
    </section>

    <section id="vfx-container">
        <!-- Particle canvas or elements -->
    </section>

    <footer>
        <p>&copy; 2024 Crunchy Bananas. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
