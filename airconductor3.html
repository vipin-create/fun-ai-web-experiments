<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Air Conductor: Dual Hand Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #video-feed { position: absolute; top: 0; left: 0; transform: scaleX(-1); visibility: hidden; } 
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); display: flex; justify-content: center; align-items: center;
            color: #00d2ff; flex-direction: column; z-index: 10; text-align: center;
        }
        h1 { text-shadow: 0 0 20px #00d2ff; margin-bottom: 10px; font-size: 3rem; }
        .tagline { color: #ff00ff; margin-bottom: 30px; letter-spacing: 2px; }
        
        button { 
            padding: 15px 50px; font-size: 18px; cursor: pointer; 
            background: transparent; color: #fff; border: 2px solid #fff; 
            border-radius: 30px; transition: 0.3s; font-weight: bold;
        }
        button:hover { background: #fff; color: #000; box-shadow: 0 0 30px #ffffff; }

        #hud {
            position: absolute; top: 20px; left: 20px; color: white; pointer-events: none;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
        }
        .hand-stat { margin-bottom: 5px; }
        .cyan { color: #00ffff; }
        .magenta { color: #ff00ff; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>AIR CONDUCTOR</h1>
        <div class="tagline">DUAL HAND TRACKING SYSTEM</div>
        <p>Raise both hands. Play chords. Drum the air.</p>
        <br>
        <button id="start-btn">ACTIVATE SYSTEM</button>
    </div>

    <div id="hud">
        <div class="hand-stat cyan">HAND L: <span id="vel-0">0</span></div>
        <div class="hand-stat magenta">HAND R: <span id="vel-1">0</span></div>
    </div>

    <video id="video-feed"></video>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            sensitivity: 1.3, 
            smoothing: 0.3,   
            decay: 0.94       
        };

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer;
        let keys = []; 
        let particles = [];
        let synth;
        
        // --- DUAL HAND SYSTEM ---
        // We store data for up to 2 hands
        const MAX_HANDS = 2;
        let handMeshes = []; 
        let handData = [
            { pos: new THREE.Vector3(0,-10,0), lastPos: new THREE.Vector3(), velocity: 0, active: false },
            { pos: new THREE.Vector3(0,-10,0), lastPos: new THREE.Vector3(), velocity: 0, active: false }
        ];

        // --- CLASS: THE VIRTUAL KEY ---
        class VirtualKey {
            constructor(x, color, note) {
                this.originalColor = new THREE.Color(color);
                this.note = note;
                // We track trigger state per hand to avoid conflict
                this.triggeredBy = [false, false]; 

                const geometry = new THREE.BoxGeometry(1.3, 3.0, 1.3);
                const material = new THREE.MeshPhongMaterial({ 
                    color: this.originalColor, 
                    emissive: 0x000000,
                    shininess: 100,
                    transparent: true,
                    opacity: 0.7
                });
                
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.set(x, 0, 0);
                scene.add(this.mesh);
            }

            update() {
                // Idle floating
                this.mesh.position.y = Math.sin(Date.now() * 0.003 + this.mesh.position.x) * 0.2;
                this.mesh.rotation.y += 0.01;
                
                // Return to normal
                this.mesh.material.emissive.lerp(new THREE.Color(0x000000), 0.1);
                this.mesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
            }

            hit(velocity, handIndex) {
                // Prevent machine-gun triggering by the same hand
                if(this.triggeredBy[handIndex]) return;

                this.triggeredBy[handIndex] = true;

                // Visual Boom
                let intensity = Math.min(velocity * 3, 1.5); 
                this.mesh.material.emissive.copy(this.originalColor).multiplyScalar(intensity + 0.2);
                this.mesh.scale.set(1.2, 1.4, 1.2);

                // Audio Boom
                let vol = Math.min(velocity * 1.5, 1); 
                synth.triggerAttackRelease(this.note, "8n", Tone.now(), vol);

                // Particle Boom
                createExplosion(this.mesh.position, this.originalColor);
            }

            reset(handIndex) {
                this.triggeredBy[handIndex] = false;
            }
        }

        // --- 1. SETUP THREE.JS ---
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.06);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 9;
            camera.position.y = 1;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(0, 10, 5);
            scene.add(dirLight);

            // Create Keys (Pentatonic)
            const colors = [0xff0055, 0xff5500, 0xffff00, 0x00ff55, 0x0055ff];
            const notes = ["C4", "Eb4", "F4", "G4", "Bb4"]; // Minor Pentatonic (Bluesy)
            
            for(let i=0; i<5; i++) {
                keys.push(new VirtualKey((i-2)*2.5, colors[i], notes[i]));
            }

            // Create Visual Cursors for Hands
            // Hand 0: Cyan
            const geo1 = new THREE.IcosahedronGeometry(0.4, 1);
            const mat1 = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
            handMeshes[0] = new THREE.Mesh(geo1, mat1);
            scene.add(handMeshes[0]);

            // Hand 1: Magenta
            const geo2 = new THREE.IcosahedronGeometry(0.4, 1);
            const mat2 = new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true });
            handMeshes[1] = new THREE.Mesh(geo2, mat2);
            scene.add(handMeshes[1]);

            animate();
        }

        // --- 2. PARTICLES ---
        function createExplosion(pos, color) {
            const geometry = new THREE.BoxGeometry(0.15, 0.15, 0.15);
            const material = new THREE.MeshBasicMaterial({ color: color });
            for (let i = 0; i < 12; i++) {
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.copy(pos);
                mesh.position.x += (Math.random()-0.5); // jitter start
                mesh.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.4,
                    (Math.random() - 0.5) * 0.4,
                    (Math.random() - 0.5) * 0.4
                );
                scene.add(mesh);
                particles.push(mesh);
            }
        }

        // --- 3. AUDIO ---
        function initAudio() {
            const reverb = new Tone.Reverb(2.5).toDestination();
            const chorus = new Tone.Chorus(4, 2.5, 0.5).connect(reverb);
            
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.02, decay: 0.1, sustain: 0.1, release: 1 }
            }).connect(chorus);
            synth.maxPolyphony = 10; // Allow many notes at once
        }

        // --- 4. MEDIAPIPE MULTI-HAND TRACKING ---
        function onResults(results) {
            // Reset active status
            handData[0].active = false;
            handData[1].active = false;

            if (results.multiHandLandmarks) {
                // Loop through detected hands (max 2)
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    if(i >= MAX_HANDS) break;

                    const landmarks = results.multiHandLandmarks[i];
                    const indexTip = landmarks[8];

                    // Map coordinates
                    const targetX = (indexTip.x - 0.5) * -18;
                    const targetY = (indexTip.y - 0.5) * -12;

                    // Smooth Lerp
                    handData[i].pos.x = THREE.MathUtils.lerp(handData[i].pos.x, targetX, CONFIG.smoothing);
                    handData[i].pos.y = THREE.MathUtils.lerp(handData[i].pos.y, targetY, CONFIG.smoothing);
                    
                    handData[i].active = true;

                    // Update Visuals
                    handMeshes[i].position.copy(handData[i].pos);
                    handMeshes[i].rotation.x += 0.1;
                    handMeshes[i].visible = true;
                }
            }
            
            // Hide inactive hands
            if(!handData[0].active) handMeshes[0].visible = false;
            if(!handData[1].active) handMeshes[1].visible = false;
        }

        // --- 5. MAIN LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // PROCESS HANDS
            for(let i=0; i<MAX_HANDS; i++) {
                if(!handData[i].active) continue;

                // 1. Calc Velocity
                let instantVel = handData[i].pos.distanceTo(handData[i].lastPos);
                handData[i].velocity = THREE.MathUtils.lerp(handData[i].velocity, instantVel, 0.5);
                
                // Update HUD
                document.getElementById(`vel-${i}`).innerText = (handData[i].velocity * 10).toFixed(0);

                // 2. Check Collisions (Hand i vs All Keys)
                keys.forEach(key => {
                    const distance = handData[i].pos.distanceTo(key.mesh.position);
                    
                    if (distance < CONFIG.sensitivity) {
                        key.hit(handData[i].velocity, i);
                    } else {
                        key.reset(i);
                    }
                });

                // Store position
                handData[i].lastPos.copy(handData[i].pos);
            }

            // Animate Keys
            keys.forEach(k => k.update());

            // Animate Particles
            for (let j = particles.length - 1; j >= 0; j--) {
                let p = particles[j];
                p.position.add(p.userData.velocity);
                p.scale.multiplyScalar(CONFIG.decay);
                if (p.scale.x < 0.01) {
                    scene.remove(p);
                    particles.splice(j, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // --- INIT ---
        const videoElement = document.getElementById('video-feed');
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        
        // CRITICAL: Set maxNumHands to 2
        hands.setOptions({ 
            maxNumHands: 2, 
            modelComplexity: 1, 
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5 
        });
        
        hands.onResults(onResults);
        
        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });

        document.getElementById('start-btn').addEventListener('click', async () => {
            await Tone.start();
            initAudio();
            initThree();
            cameraFeed.start();
            document.getElementById('overlay').style.display = 'none';
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
