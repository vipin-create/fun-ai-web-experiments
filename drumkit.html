<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Air Drum Kit Studio</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #video-feed { position: absolute; top: 0; left: 0; transform: scaleX(-1); visibility: hidden; } 
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center;
            color: #ff9900; flex-direction: column; z-index: 10;
        }
        h1 { font-size: 3.5rem; margin: 0; letter-spacing: 5px; text-transform: uppercase; text-shadow: 0 0 20px #ff9900; }
        p { color: white; font-size: 1.2rem; margin-top: 10px; }
        
        button { 
            margin-top: 30px; padding: 15px 50px; font-size: 18px; cursor: pointer; 
            background: transparent; color: #ff9900; border: 2px solid #ff9900; 
            border-radius: 50px; font-weight: bold; transition: 0.3s;
        }
        button:hover { background: #ff9900; color: #000; box-shadow: 0 0 40px #ff9900; }

        #hud {
            position: absolute; top: 20px; left: 20px; color: #888; pointer-events: none; font-size: 0.8rem;
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>Air Drum Kit</h1>
        <p>VIRTUAL REALITY PERCUSSION SYSTEM</p>
        <button id="start-btn">SIT AT THE DRUMS</button>
    </div>

    <div id="hud">
        LEFT HAND: <span id="l-stat">READY</span><br>
        RIGHT HAND: <span id="r-stat">READY</span>
    </div>

    <video id="video-feed"></video>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            sensitivity: 1.2, 
            smoothing: 0.4,   
            hitCooldown: 100 // ms
        };

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer;
        let instruments = []; 
        let particles = [];
        let drumSounds = {}; // Object to hold our synths
        
        // Tracking
        const MAX_HANDS = 2;
        let handMeshes = []; 
        let handData = [
            { pos: new THREE.Vector3(0,-10,0), velocity: 0, active: false },
            { pos: new THREE.Vector3(0,-10,0), velocity: 0, active: false }
        ];

        // --- AUDIO DESIGN (Procedural Drums) ---
        function initAudio() {
            const reverb = new Tone.Reverb(1.5).toDestination();
            const limiter = new Tone.Limiter(-2).connect(reverb); // Prevent clipping

            // 1. KICK (Deep, Thumpy)
            drumSounds.kick = new Tone.MembraneSynth({
                pitchDecay: 0.05, octaves: 4, oscillator: { type: "sine" },
                envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 1.4 }
            }).connect(limiter);

            // 2. SNARE (Punchy + Noise)
            const snareNoise = new Tone.NoiseSynth({
                noise: { type: "pink" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0 }
            });
            const snareTone = new Tone.MembraneSynth({
                pitchDecay: 0.01, octaves: 2, envelope: { attack: 0.001, decay: 0.2, sustain: 0}
            });
            drumSounds.snare = { noise: snareNoise.connect(limiter), tone: snareTone.connect(limiter) };

            // 3. HI-HAT (Metallic, Short)
            drumSounds.hat = new Tone.MetalSynth({
                frequency: 200, envelope: { attack: 0.001, decay: 0.05, release: 0.05 },
                harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5
            }).connect(limiter);

            // 4. TOMS (Resonant)
            drumSounds.tom = new Tone.MembraneSynth({
                pitchDecay: 0.1, octaves: 4, oscillator: { type: "sine" },
                envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 1.4 }
            }).connect(limiter);

            // 5. CRASH (Long Sustain Metal)
            drumSounds.crash = new Tone.MetalSynth({
                frequency: 300, envelope: { attack: 0.001, decay: 1.4, release: 0.2 },
                harmonicity: 5.1, modulationIndex: 64, resonance: 4000, octaves: 1.5
            }).connect(reverb); // More reverb on crash
        }

        // --- VISUAL COMPONENT: DRUM ---
        class DrumComponent {
            constructor(name, x, y, color, type, soundFunction) {
                this.originalColor = new THREE.Color(color);
                this.soundFunction = soundFunction;
                this.name = name;
                this.triggeredBy = [false, false];

                // Geometry based on Type (Cylinder for Drums, Flat Cylinder for Cymbals)
                let geometry;
                if (type === 'cymbal') {
                    geometry = new THREE.CylinderGeometry(1.2, 1.2, 0.1, 32); // Flat disc
                } else {
                    geometry = new THREE.CylinderGeometry(1.4, 1.4, 1.5, 32); // Deep drum
                }

                const material = new THREE.MeshPhongMaterial({ 
                    color: this.originalColor, 
                    emissive: 0x000000,
                    specular: 0xffffff,
                    shininess: 80,
                    transparent: true, 
                    opacity: 0.9
                });

                this.mesh = new THREE.Mesh(geometry, material);
                
                // Position and Rotation
                this.mesh.position.set(x, y, 0);
                this.mesh.rotation.x = Math.PI / 2; // Face the player
                
                // Tilt logic: Angle drums towards center
                if(x < 0) this.mesh.rotation.z = -0.2;
                if(x > 0) this.mesh.rotation.z = 0.2;

                scene.add(this.mesh);
                
                // Add a text-like rim glow
                const rimGeo = new THREE.TorusGeometry(type === 'cymbal' ? 1.2 : 1.4, 0.05, 16, 100);
                const rimMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const rim = new THREE.Mesh(rimGeo, rimMat);
                this.mesh.add(rim);
            }

            update() {
                // Return to normal color
                this.mesh.material.emissive.lerp(new THREE.Color(0x000000), 0.1);
                this.mesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.2);
            }

            hit(velocity, handIndex) {
                if(this.triggeredBy[handIndex]) return;
                this.triggeredBy[handIndex] = true;

                // 1. Audio
                const vol = Math.min(velocity * 0.8, 1);
                this.soundFunction(vol);

                // 2. Visual Recoil
                this.mesh.material.emissive.copy(this.originalColor).multiplyScalar(2);
                this.mesh.scale.set(1.1, 1.1, 0.8); // Squish effect
                
                createParticles(this.mesh.position, this.originalColor);

                // HUD Update
                document.getElementById(handIndex === 0 ? 'l-stat' : 'r-stat').innerText = this.name;
                document.getElementById(handIndex === 0 ? 'l-stat' : 'r-stat').style.color = "#" + this.originalColor.getHexString();
            }

            reset(handIndex) {
                this.triggeredBy[handIndex] = false;
            }
        }

        // --- 1. SETUP THREE.JS ---
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.05);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Studio Lighting
            const spotLight = new THREE.SpotLight(0xffffff, 1);
            spotLight.position.set(0, 20, 10);
            spotLight.angle = 0.5;
            scene.add(spotLight);
            scene.add(new THREE.AmbientLight(0x404040));

            // --- BUILD THE KIT ---
            // 1. HI-HAT (Top Left) - Yellow
            instruments.push(new DrumComponent("HI-HAT", -4.5, 3, 0xffff00, 'cymbal', (vol) => {
                drumSounds.hat.triggerAttackRelease("32n", Tone.now(), vol);
            }));

            // 2. SNARE (Mid Left) - Red
            instruments.push(new DrumComponent("SNARE", -2.5, 0, 0xff0000, 'drum', (vol) => {
                drumSounds.snare.noise.triggerAttackRelease("16n", Tone.now(), vol);
                drumSounds.snare.tone.triggerAttackRelease("C3", "16n", Tone.now(), vol);
            }));

            // 3. KICK (Center Low) - White
            instruments.push(new DrumComponent("KICK", 0, -3, 0xffffff, 'drum', (vol) => {
                drumSounds.kick.triggerAttackRelease("C1", "8n", Tone.now(), vol);
            }));

            // 4. HI TOM (Mid Right) - Blue
            instruments.push(new DrumComponent("TOM", 2.5, 0, 0x0088ff, 'drum', (vol) => {
                drumSounds.tom.triggerAttackRelease("G2", "8n", Tone.now(), vol);
            }));

            // 5. CRASH (Top Right) - Purple
            instruments.push(new DrumComponent("CRASH", 4.5, 3, 0xaa00ff, 'cymbal', (vol) => {
                drumSounds.crash.triggerAttackRelease("16n", Tone.now(), vol + 0.2); // Boost vol
            }));

            // HAND VISUALS
            const handGeo = new THREE.SphereGeometry(0.3, 16, 16);
            handMeshes[0] = new THREE.Mesh(handGeo, new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true }));
            handMeshes[1] = new THREE.Mesh(handGeo, new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true }));
            scene.add(handMeshes[0]);
            scene.add(handMeshes[1]);

            animate();
        }

        // --- PARTICLES ---
        function createParticles(pos, color) {
            const geometry = new THREE.PlaneGeometry(0.15, 0.15);
            const material = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide });
            
            for(let i=0; i<8; i++) {
                const p = new THREE.Mesh(geometry, material);
                p.position.copy(pos);
                // Random Scatter
                p.userData.velocity = new THREE.Vector3((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, Math.random()*0.5);
                scene.add(p);
                particles.push(p);
            }
        }

        // --- TRACKING & LOOP ---
        function onResults(results) {
            handData[0].active = false; 
            handData[1].active = false;

            if (results.multiHandLandmarks) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    if(i >= MAX_HANDS) break;
                    const lm = results.multiHandLandmarks[i][8]; // Index Tip
                    
                    // Map to scene
                    const tx = (lm.x - 0.5) * -20;
                    const ty = (lm.y - 0.5) * -12;
                    
                    // Smooth
                    handData[i].pos.x = THREE.MathUtils.lerp(handData[i].pos.x, tx, CONFIG.smoothing);
                    handData[i].pos.y = THREE.MathUtils.lerp(handData[i].pos.y, ty, CONFIG.smoothing);
                    
                    // Calc Velocity
                    let v = handData[i].pos.distanceTo(handMeshes[i].position); 
                    handData[i].velocity = THREE.MathUtils.lerp(handData[i].velocity, v, 0.5);
                    
                    handData[i].active = true;
                    handMeshes[i].position.copy(handData[i].pos);
                    handMeshes[i].visible = true;
                }
            }
            if(!handData[0].active) handMeshes[0].visible = false;
            if(!handData[1].active) handMeshes[1].visible = false;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Check Collisions
            instruments.forEach(inst => {
                inst.update();
                for(let i=0; i<MAX_HANDS; i++) {
                    if(handData[i].active) {
                        if(handData[i].pos.distanceTo(inst.mesh.position) < CONFIG.sensitivity) {
                            inst.hit(handData[i].velocity, i);
                        } else {
                            inst.reset(i);
                        }
                    }
                }
            });

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.position.add(p.userData.velocity);
                p.rotation.x += 0.1;
                p.scale.multiplyScalar(0.92);
                if(p.scale.x < 0.05) { scene.remove(p); particles.splice(i, 1); }
            }

            renderer.render(scene, camera);
        }

        // --- INIT ---
        const videoElement = document.getElementById('video-feed');
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);
        
        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });

        document.getElementById('start-btn').addEventListener('click', async () => {
            await Tone.start();
            initAudio();
            initThree();
            cameraFeed.start();
            document.getElementById('overlay').style.display = 'none';
        });
        
        window.addEventListener('resize', () => {
             camera.aspect = window.innerWidth / window.innerHeight;
             camera.updateProjectionMatrix();
             renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
